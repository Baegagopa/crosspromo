name: Guard Private Paths

on:
  push:
  pull_request:

jobs:
  guard-private-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure private/local paths are not tracked
        run: |
          chmod +x .githooks/check-private-paths.sh
          ./.githooks/check-private-paths.sh tracked

      - name: Ensure bloomrows/version.json exists and is valid (Bloom Rows update notice)
        run: |
          chmod +x .githooks/check-bloomrows-version.sh
          ./.githooks/check-bloomrows-version.sh worktree
